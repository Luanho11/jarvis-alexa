name: Pruebas en Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # La mínima que pide el README y la más reciente que suele instalar quien descarga Python hoy.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Importar las librerías de Windows
        run: python -c "import comtypes, pycaw.pycaw, pyautogui, pygetwindow, pyperclip, PIL.ImageGrab, psutil, docx, winreg, pystray"
      - name: Pruebas (incluye arrancar servidor.py y las comprobaciones solo de Windows)
        run: python -m pytest -q -rs
